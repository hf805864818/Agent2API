name: iOS Release

# 打 tag 时出包并建 Release，手机上直接点链接用 TrollStore 打开安装。
#   git tag v3.4.2 && git push origin v3.4.2
#
# 与 ios-ipa.yml 的区别只有一个：多了 Release 步骤，并把产物挂上去。
# 构建逻辑都在 scripts/build-ipa.sh 里，两边完全一致。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci 失败，退回 npm install"
            npm install --no-audit --no-fund
          }

      - name: Build IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Agent2API-ipa-${{ github.run_number }}
          path: |
            build/out/*.ipa
            build/out/build-info.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/out/*.ipa
            build/out/build-info.json
          name: Agent2API iOS ${{ github.ref_name }}
          body: |
            iOS 侧载包（${{ github.ref_name }}）。要求 iOS 15.0+ / arm64。

            | 产物 | 用途 |
            |---|---|
            | `*-unsigned.ipa` | TrollStore（巨魔）、AppSync Unified、越狱机 |
            | `*-adhoc.ipa` | 爱思助手 / Sideloadly / AltStore（ad-hoc 或自有证书重签） |

            首次启动会请求「本地网络」权限 —— 拒绝后连不上局域网网关，需要到
            设置 → 隐私与安全性 → 本地网络 里重新打开。
          draft: false
          prerelease: false
